name: Refresh Composer Autoload - ByetHost

on:
  workflow_dispatch:

jobs:
  refresh-autoload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_mysql, gd, zip, curl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Generate Composer autoload
        run: |
          set -e

          echo "Generating Composer autoload..."

          composer dump-autoload \
            --no-dev \
            --optimize \
            --no-interaction

          test -f vendor/autoload.php
          test -d vendor/composer

          echo "Autoload generated successfully."

      - name: Prepare ONLY autoload files
        run: |
          set -e

          rm -rf deploy
          mkdir -p deploy/vendor/composer

          cp vendor/autoload.php \
             deploy/vendor/autoload.php

          cp vendor/composer/*.php \
             deploy/vendor/composer/

          echo "Prepared files:"
          find deploy/vendor -type f | sort

      - name: Upload ONLY autoload to existing htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.BYETHOST_FTP_PORT }}

          # FTP account Anda sudah berada di /htdocs
          server-dir: ./

          # Hanya package kecil yang dibuat di atas
          local-dir: ./deploy/

          # JANGAN menghapus source yang sudah ada
          dangerous-clean-slate: false

          log-level: standard

          exclude: |
            **/.git*
            **/.github/**

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "AUTOLOAD REFRESH SELESAI"
          echo "=========================================="
          echo ""
          echo "Server source TIDAK diubah."
          echo "Vendor package TIDAK di-upload ulang."
          echo ""
          echo "Yang diperbarui:"
          echo "/htdocs/vendor/autoload.php"
          echo "/htdocs/vendor/composer/*.php"
          echo ""
          echo "Server .env TIDAK diubah."
          echo "=========================================="

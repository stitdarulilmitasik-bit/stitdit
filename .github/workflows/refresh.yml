name: Refresh Laravel Autoload Only - ByetHost

on:
  workflow_dispatch:

jobs:
  refresh-autoload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_mysql, gd, zip, curl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install dependencies for autoload generation
        run: |
          set -e

          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

      - name: Prepare ONLY Composer autoload
        run: |
          set -e

          rm -rf deploy
          mkdir -p deploy/vendor/composer

          cp vendor/autoload.php deploy/vendor/autoload.php
          cp vendor/composer/*.php deploy/vendor/composer/

          echo "========================================"
          echo "FILES TO DEPLOY"
          echo "========================================"

          find deploy -type f | sort

          echo ""
          echo "No Laravel source will be deployed."
          echo "No app directory will be deployed."
          echo "No docker_backup will be deployed."
          echo "No full vendor will be deployed."

      - name: Upload ONLY autoload to htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.BYETHOST_FTP_PORT }}

          # FTP ROOT berisi htdocs/
          # Laravel berada di FTP ROOT/htdocs/
          server-dir: ./htdocs/

          # Hanya folder deploy yang berisi vendor/autoload.php
          local-dir: ./deploy/

          dangerous-clean-slate: false
          log-level: standard

          exclude: |
            **/.git*
            **/.github/**
            **/app/**
            **/bootstrap/**
            **/config/**
            **/database/**
            **/public/**
            **/resources/**
            **/routes/**
            **/storage/**
            **/.env
            **/vendor/laravel/**
            **/vendor/coderflex/**
            **/vendor/livewire/**
            **/vendor/barryvdh/**
            **/vendor/phpoffice/**
            **/vendor/maatwebsite/**
            **/vendor/guzzlehttp/**
            **/vendor/symfony/**
            **/vendor/psr/**
            **/vendor/doctrine/**
            **/vendor/monolog/**
            **/vendor/*

      - name: Verify package
        run: |
          echo "========================================"
          echo "AUTOLOAD-ONLY DEPLOYMENT FINISHED"
          echo "========================================"
          echo ""
          echo "Target:"
          echo "FTP ROOT/htdocs/vendor/"
          echo ""
          echo "Source Laravel tidak di-upload."
          echo "docker_backup tidak di-upload."
          echo "Full vendor tidak di-upload."

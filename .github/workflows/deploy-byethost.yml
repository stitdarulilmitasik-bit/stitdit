name: Deploy Laravel to ByetHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: byethost-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy source to ByetHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.BYETHOST_FTP_PORT }}
          local-dir: ./
          server-dir: ./htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/vendor/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/deploy/**
            deploy/**
          dangerous-clean-slate: false
          log-level: standard

      - name: Deployment summary
        shell: bash
        run: |
          echo "========================================"
          echo "ByetHost deployment completed."
          echo "Source uploaded directly; no deploy staging folder."
          echo "Composer was NOT executed."
          echo "vendor was NOT uploaded."
          echo "server .env was NOT uploaded."
          echo "server storage runtime data was preserved."
          echo "========================================"

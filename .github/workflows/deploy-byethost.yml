name: Deploy Laravel to ByetHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: byethost-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and previous commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare only committed file changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf .commit-sync
          mkdir -p .commit-sync

          if [ -z "${BEFORE_SHA:-}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="${AFTER_SHA}^"
          fi

          git diff --name-status -M "${BEFORE_SHA}" "${AFTER_SHA}" > .commit-sync/changes.txt

          changed=0
          deleted=0

          while IFS=$'\t' read -r status path old_path; do
            [ -z "${status:-}" ] && continue

            # Never upload protected/server-only paths.
            case "${path}" in
              .git/*|.github/*|vendor/*|.env|storage/logs/*|storage/framework/cache/*|storage/framework/sessions/*|storage/framework/views/*|deploy/*)
                continue
                ;;
            esac

            case "${status}" in
              A|M)
                mkdir -p ".commit-sync/$(dirname "${path}")"
                cp -- "${path}" ".commit-sync/${path}"
                changed=$((changed + 1))
                ;;
              R*)
                # Upload the new path and remove the old path on the server.
                mkdir -p ".commit-sync/$(dirname "${path}")"
                cp -- "${path}" ".commit-sync/${path}"
                echo "DELETE	${old_path}" >> .commit-sync/deletions.txt
                changed=$((changed + 1))
                deleted=$((deleted + 1))
                ;;
              D)
                echo "DELETE	${path}" >> .commit-sync/deletions.txt
                deleted=$((deleted + 1))
                ;;
            esac
          done < .commit-sync/changes.txt

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "deleted=${deleted}" >> "${GITHUB_OUTPUT}"

          echo "Files to upload: ${changed}"
          echo "Files to delete: ${deleted}"

      - name: Upload only changed files to ByetHost
        if: steps.changes.outputs.changed != '0'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.BYETHOST_FTP_PORT }}
          local-dir: ./.commit-sync/
          server-dir: ./htdocs/
          exclude: |
            changes.txt
            deletions.txt
            **/.git*
            **/.github/**
            **/vendor/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/deploy/**
          dangerous-clean-slate: false
          log-level: standard

      - name: Delete removed files from ByetHost
        if: steps.changes.outputs.deleted != '0'
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.BYETHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BYETHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.BYETHOST_FTP_PORT }}
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r action path; do
            [ "${action:-}" = "DELETE" ] || continue

            case "${path}" in
              .git/*|.github/*|vendor/*|.env|storage/logs/*|storage/framework/cache/*|storage/framework/sessions/*|storage/framework/views/*|deploy/*)
                continue
                ;;
            esac

            echo "Deleting: ${path}"

            curl --fail --silent --show-error \
              --ftp-method nocwd \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              --ftp-port "${FTP_PORT}" \
              "ftp://${FTP_SERVER}/htdocs/${path}" \
              -Q "DELE ${path}" || true
          done < .commit-sync/deletions.txt

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf .commit-sync

      - name: Deployment summary
        shell: bash
        run: |
          echo "========================================"
          echo "Commit-based ByetHost sync completed."
          echo "Only files changed by this commit were prepared for upload."
          echo "Target: ./htdocs/"
          echo "No server deploy/ folder is used."
          echo "vendor and .env are excluded."
          echo "Laravel runtime storage is preserved."
          echo "========================================"

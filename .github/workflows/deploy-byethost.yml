name: Deploy Laravel to ByetHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: byethost-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare deployment package
        shell: bash
        run: |
          set -e

          rm -rf deploy
          mkdir -p deploy

          # Copy the Laravel application, but NEVER deploy vendor.
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='vendor/'             --exclude='node_modules/'             --exclude='.env'             --exclude='storage/logs/*'             --exclude='storage/framework/cache/*'             --exclude='storage/framework/sessions/*'             --exclude='storage/framework/views/*'             ./ deploy/

          # Ensure runtime directories exist without replacing server data.
          mkdir -p deploy/storage/app
          mkdir -p deploy/storage/framework/cache
          mkdir -p deploy/storage/framework/sessions
          mkdir -p deploy/storage/framework/views
          mkdir -p deploy/storage/logs

          echo "Deployment package prepared."
          echo "vendor is intentionally excluded."
          test ! -d deploy/vendor

      - name: Deploy source to ByetHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.BYETHOST_FTP_SERVER }}
          username: ${{ secrets.BYETHOST_FTP_USERNAME }}
          password: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.BYETHOST_FTP_PORT }}
          local-dir: ./deploy/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/vendor/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
          dangerous-clean-slate: false
          log-level: standard

      - name: Deployment summary
        shell: bash
        run: |
          echo "========================================"
          echo "ByetHost deployment completed."
          echo "Composer was NOT executed."
          echo "vendor was NOT uploaded."
          echo "server .env was NOT uploaded."
          echo "server storage runtime data was preserved."
          echo "========================================"

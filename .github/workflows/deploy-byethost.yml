name: Deploy Laravel to ByetHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: byethost-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and previous commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prepare changed files only
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf .commit-sync
          mkdir -p .commit-sync

          if [ -z "${BEFORE_SHA:-}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="${AFTER_SHA}^"
          fi

          git diff --name-status -M "${BEFORE_SHA}" "${AFTER_SHA}" > .commit-sync/changes.txt

          changed=0

          while IFS=$'\t' read -r status path old_path; do
            [ -z "${status:-}" ] && continue

            # Hanya file yang memang berubah pada commit ini.
            # File hosting/server-only TIDAK disentuh.
            case "${path}" in
              .git/*|.github/*|vendor/*|.env|storage/logs/*|storage/framework/cache/*|storage/framework/sessions/*|storage/framework/views/*|deploy/*)
                continue
                ;;
            esac

            case "${status}" in
              A|M|R*)
                mkdir -p ".commit-sync/$(dirname "${path}")"
                cp -- "${path}" ".commit-sync/${path}"
                changed=$((changed + 1))
                ;;
              D)
                # PENTING:
                # File yang dihapus dari GitHub TIDAK dihapus dari hosting.
                echo "SKIP DELETE: ${path}"
                ;;
            esac
          done < .commit-sync/changes.txt

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "Files prepared for upload: ${changed}"

      - name: Upload changed files only (no remote sync)
        if: steps.changes.outputs.changed != '0'
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.BYETHOST_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BYETHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BYETHOST_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.BYETHOST_FTP_PORT }}
        run: |
          set -euo pipefail

          echo "Uploading ONLY files changed by this commit."
          echo "Existing files/folders on /htdocs will NOT be deleted."

          while IFS= read -r file; do
            [ -n "${file}" ] || continue

            echo "Uploading: ${file}"

            remote_dir="$(dirname "${file}")"

            # Buat folder tujuan bila diperlukan.
            if [ "${remote_dir}" != "." ]; then
              curl --fail --silent --show-error \
                --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                --ftp-port "${FTP_PORT}" \
                --ftp-create-dirs \
                --upload-file ".commit-sync/${file}" \
                "ftp://${FTP_SERVER}/htdocs/${file}"
            else
              curl --fail --silent --show-error \
                --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                --ftp-port "${FTP_PORT}" \
                --upload-file ".commit-sync/${file}" \
                "ftp://${FTP_SERVER}/htdocs/${file}"
            fi
          done < <(find .commit-sync -type f ! -name changes.txt -printf '%P\n' | sort)

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf .commit-sync

      - name: Deployment summary
        shell: bash
        run: |
          echo "========================================"
          echo "Incremental ByetHost upload completed."
          echo "ONLY files changed by the latest commit were uploaded."
          echo "NO remote synchronization was performed."
          echo "NO remote files/folders were deleted."
          echo "Target: ./htdocs/"
          echo "vendor and .env are excluded."
          echo "Laravel runtime storage is preserved."
          echo "Existing hosting folders are preserved."
          echo "========================================"
